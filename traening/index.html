<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Min træning">
<meta name="theme-color" content="#9E2F5D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Min træning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Lys, rolig bund med dyb bærfarve som accent. Én kolonne, store trykflader, bundmenu som en app. */
  --bg:#F6F3F4; --surface:#FFFFFF; --surface-2:#F0EAEC; --line:#E4DBDF;
  --ink:#1F1A1D; --muted:#76696F;
  --accent:#9E2F5D; --accent-ink:#FFFFFF; --accent-soft:#F6E3EB;
  --good:#2E8B62; --good-soft:#E2F3EA; --warn:#C2621B;
  --display:"Sora",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141113; --surface:#1E191C; --surface-2:#2A2327; --line:#382F34;
  --ink:#F4EEF1; --muted:#AD9FA6; --accent:#E06C9A; --accent-ink:#1A0E14; --accent-soft:#3A2230;
  --good:#5CC796; --good-soft:#1C3328; --warn:#F09A5A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141113; --surface:#1E191C; --surface-2:#2A2327; --line:#382F34;
  --ink:#F4EEF1; --muted:#AD9FA6; --accent:#E06C9A; --accent-ink:#1A0E14; --accent-soft:#3A2230;
  --good:#5CC796; --good-soft:#1C3328; --warn:#F09A5A; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font:800 28px/1.1 var(--display);margin:6px 0 4px;letter-spacing:-.4px;text-wrap:balance}
h2{font:700 19px/1.2 var(--display);margin:22px 0 10px;letter-spacing:-.2px}
h3{font:700 16px/1.25 var(--display);margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stack{display:grid;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--body);padding:6px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.pill.g{background:var(--good-soft);color:var(--good)}
.btn{border:0;border-radius:14px;padding:15px 16px;font:700 16px/1 var(--display);background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{width:auto;padding:10px 14px;font-size:14px;border-radius:12px}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0}
/* Bundmenu */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.bottom button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px;color:var(--muted);font-size:12px;font-weight:600}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button[aria-current="page"]{color:var(--accent)}
/* Programmer */
.prog{border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.prog .head{padding:16px;background:linear-gradient(135deg,var(--accent),#5B1F3C);color:#fff}
.prog .head h3{font-size:20px;color:#fff}
.prog .head p{margin:6px 0 0;font-size:14px;opacity:.9}
.wo{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.wo .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:800 14px/1 var(--display);flex:none}
.wo .chev{color:var(--muted)}
/* Pas-detalje */
.block{display:grid;gap:8px}
.blabel{font:600 12px/1 var(--body);letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.exrow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.exrow .letter{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:700 12px/1 var(--display);color:var(--muted);flex:none}
.exrow.done{border-color:var(--good)}
.exrow.done .letter{background:var(--good);color:#fff}
/* Afspiller */
.player{display:grid;gap:12px}
.progressbar{display:flex;gap:3px}
.progressbar span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progressbar span.on{background:var(--accent)}
.progressbar span.cur{background:var(--ink)}
.exhead{display:grid;gap:6px}
.exhead h1{font-size:24px}
.setrow{display:grid;grid-template-columns:40px 1fr 1fr 48px;gap:8px;align-items:center}
.setrow .n{font:700 14px/1 var(--display);color:var(--muted);text-align:center}
.stepper{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;background:var(--surface-2);border-radius:12px;height:48px}
.stepper button{background:none;border:0;height:100%;font:700 20px/1 var(--body);color:var(--muted)}
.stepper input{width:100%;min-width:0;background:none;border:0;text-align:center;font:700 17px/1 var(--display);font-variant-numeric:tabular-nums;padding:0}
.stepper small{display:block;text-align:center;font-size:10px;color:var(--muted);margin-top:-4px}
.chk{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--accent-ink)}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.chk svg{width:22px;height:22px}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--ink);color:var(--bg);display:none;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.timer.on{display:block}
.timer.done{background:var(--good);color:#fff}
.timer .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer b{font:800 36px/1 var(--display);font-variant-numeric:tabular-nums;min-width:86px}
.timer button{border:0;border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.16);color:inherit;font-weight:700}
.big{font:800 88px/1 var(--display);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.phase{text-align:center;font:700 14px/1 var(--display);letter-spacing:1px;text-transform:uppercase}
.phase.work{color:var(--accent)} .phase.rest{color:var(--good)}
.ring{display:grid;place-items:center;padding:22px 0}
/* Aktivitet */
.weekchart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding:8px 0 0}
.weekchart .col{display:grid;gap:6px;justify-items:center;align-items:end;height:100%}
.weekchart .bar{width:70%;max-width:30px;border-radius:8px 8px 3px 3px;background:var(--accent);min-height:3px}
.weekchart .bar.zero{background:var(--line)}
.weekchart .lab{font-size:12px;color:var(--muted)}
.weekchart .val{font-size:11px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tile b{display:block;font:800 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12px}
.tile.goal{background:var(--good-soft);border-color:transparent}
.sess{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
/* Fremskridt */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chart{width:100%;height:190px;display:block}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,textarea{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:12px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea{min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace}
/* Ark (bottom sheet) */
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,15,.45);z-index:20;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:88%;overflow:auto;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:none}
.sheet.on{display:block}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 6px;font-weight:700}
.rate button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;z-index:30;display:none}
.toast.on{display:block}
.banner{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center}
.vid{display:inline-flex;gap:6px;align-items:center;color:var(--accent);font-weight:700;text-decoration:none;font-size:14px}
@media (prefers-reduced-motion:no-preference){.chk,.exrow{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap"><main id="view"></main></div>

<nav class="bottom" id="nav"><div class="in">
  <button data-v="train" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Træning</button>
  <button data-v="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Aktivitet</button>
  <button data-v="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Fremskridt</button>
</div></nav>

<div class="timer" id="timer" role="status" aria-live="polite"><div class="in">
  <b id="tLeft">1:00</b><div class="grow"><div style="font-weight:700" id="tLabel">Pause</div><div class="small" style="opacity:.8">Næste sæt når den bipper</div></div>
  <button id="tPlus">+15 s</button><button id="tStop">Stop</button>
</div></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= Standardprogrammer (fra den gamle app) ================= */
let _id=0;const uid=p=>(p||"x")+Date.now().toString(36)+(_id++).toString(36);
function N(name,sets,reps,extra){return Object.assign({id:uid("e"),name,sets,reps,rest:60,unit:"kg"},extra||{})}
function CARDIO(name,min){return{id:uid("e"),name,sets:1,reps:min+" min",rest:60,unit:"min"}}
const DEFAULT_PROGRAMS=()=>[
 {id:"badass2",name:"BADASS 2.0",desc:"3 træninger om ugen, delt op i push, pull og legs, så alle muskelgrupper får mest muligt volumen. Fordel træningerne over ugen, så der er en eller flere hviledage imellem. Gå 7–10.000 skridt dagligt ved siden af.",
  workouts:[
   {id:"push",name:"Push",type:"sets",tags:"Bryst · Skuldre · Triceps · Mave",blocks:[
     {kind:"normal",ex:[CARDIO("Stairmaster",10)]},
     {kind:"normal",ex:[N("Bench Press",3,"10")]},
     {kind:"normal",ex:[N("Seated Dumbbell Press",3,"10")]},
     {kind:"normal",ex:[N("Plateloaded Incline Machine Chest Press",3,"10")]},
     {kind:"super",ex:[N("Dumbbell Lateral Raise",3,"10"),N("Standing Dumbbell Front Raise",3,"10")]},
     {kind:"normal",ex:[N("Cable Straight Bar Tricep Extension",3,"10")]},
     {kind:"super",ex:[N("Flutter Kicks",3,"10",{unit:null}),N("Russian Twist",3,"10")]}]},
   {id:"pull",name:"Pull",type:"sets",tags:"Ryg · Biceps · Mave",blocks:[
     {kind:"normal",ex:[CARDIO("Stairmaster",10)]},
     {kind:"normal",ex:[N("Wide Grip Pull Down",3,"10–12")]},
     {kind:"normal",ex:[N("Plateloaded Machine Row",3,"12")]},
     {kind:"normal",ex:[N("Dumbbell Bent Over Row",3,"10")]},
     {kind:"drop",ex:[N("Wide Grip One Arm Cable Pull Down",3,"8–12",{note:"1 drop pr. sæt"})]},
     {kind:"super",ex:[N("Cable Rope Straight Arm Pull Down",3,"12"),N("Cable Face Pull",3,"12")]},
     {kind:"normal",ex:[N("Standing Barbell Bicep Curl",3,"8")]},
     {kind:"super",ex:[N("Floor Leg Raise",3,"10",{unit:null}),N("Dumbbell Side Bends",3,"10")]}]},
   {id:"legs",name:"Legs",type:"sets",tags:"Baller · Lår · Baglår · Mave",blocks:[
     {kind:"normal",ex:[CARDIO("Stairmaster",10)]},
     {kind:"normal",ex:[N("Squat",3,"8")]},
     {kind:"normal",ex:[N("Barbell Hip Thrust",3,"10–12")]},
     {kind:"super",ex:[N("Dumbbell Bulgarian Split Squat",3,"8"),N("Bodyweight Bulgarian Split Squat",3,"12",{unit:null})]},
     {kind:"super",ex:[N("Cable Glute Kickback",3,"12"),N("Cable Hip Abduction",3,"12")]},
     {kind:"normal",ex:[N("Machine Lying Leg Curl",3,"10")]},
     {kind:"super",ex:[N("Crunch",3,"10",{unit:null}),N("Lying Leg and Hip Raise",3,"10",{unit:null}),N("Side Crunch",3,"10",{unit:null})]}]}
  ]},
 {id:"assw",name:"ASS WORKOUT",desc:"3 træninger om ugen fordelt på underkrop, overkrop og hele kroppen – med mave i hvert pas.",
  workouts:[
   {id:"lower",name:"Lower + mave",type:"sets",tags:"Baller · Lår · Baglår · Mave",blocks:[
     {kind:"normal",ex:[CARDIO("Treadmill Power Walk",10)]},
     {kind:"normal",ex:[N("Smith Machine Hip Thrust",3,"12")]},
     {kind:"normal",ex:[N("Machine Hip Abduction",3,"10")]},
     {kind:"normal",ex:[N("45 Degree Wide Stance Leg Press",3,"12")]},
     {kind:"normal",ex:[N("Romanian Deadlift",3,"12")]},
     {kind:"normal",ex:[N("Cable Step Up",3,"10")]},
     {kind:"normal",ex:[N("Cable Glute Kickback",3,"15")]},
     {kind:"normal",ex:[N("Weighted Hyperextension",3,"12")]},
     {kind:"super",ex:[N("Floor Leg Raise",3,"10",{unit:null}),N("Alternating Lying Heel Touches",3,"10",{unit:null})]}]},
   {id:"upper",name:"Upper + mave",type:"sets",tags:"Skuldre · Ryg · Arme · Mave",blocks:[
     {kind:"normal",ex:[CARDIO("Treadmill Power Walk",10)]},
     {kind:"super",ex:[N("Leaning Cable Lateral Raise",3,"12"),N("One Arm Cable Front Raise",3,"12")]},
     {kind:"normal",ex:[N("Straight Arm Pull Down",3,"10")]},
     {kind:"normal",ex:[N("Seated One Arm Cable Row",3,"8–12")]},
     {kind:"normal",ex:[N("Seated Smith Machine Shoulder Press",3,"10")]},
     {kind:"super",ex:[N("One Arm Dumbbell Preacher Curl",3,"12"),N("Cable Rope Tricep Extension",3,"10")]},
     {kind:"super",ex:[N("Bench Lying Leg Raise",3,"12",{unit:null}),N("Side Crunch",3,"10",{unit:null})]}]},
   {id:"full",name:"Fullbody",type:"sets",tags:"Hele kroppen · Mave",blocks:[
     {kind:"normal",ex:[CARDIO("Treadmill Power Walk",10)]},
     {kind:"normal",ex:[N("Smith Machine Squat",3,"10")]},
     {kind:"normal",ex:[N("Barbell Good Morning",3,"15")]},
     {kind:"normal",ex:[N("Dumbbell Lateral Raise",3,"12")]},
     {kind:"normal",ex:[N("Wide Neutral Grip Pull Down",3,"12")]},
     {kind:"normal",ex:[N("Seated Neutral Grip Shoulder Press",3,"12")]},
     {kind:"normal",ex:[N("Seated Cable Row",3,"10")]},
     {kind:"normal",ex:[N("Machine Rear Delt Fly",3,"12")]},
     {kind:"super",ex:[N("Cable Crunch",3,"12"),N("Bench Lying Leg Raise",3,"12",{unit:null})]}]}
  ]},
 {id:"core",name:"CORE",desc:"Cirkeltræning på tid for mave og core. Kan laves hjemme uden udstyr.",
  workouts:[
   {id:"hiit",name:"HIIT / cirkeltræning",type:"circuit",tags:"Mave · Skrå mavemuskler · Core",work:40,restSec:20,rounds:3,blocks:[
     {kind:"circuit",ex:["Dead Bug","Plank Shoulder Taps","Reverse Crunch","Side Plank (højre)","Side Plank (venstre)","Contralateral Bird Dog","Mountain Climber","Hollow Body Hold"].map(n=>({id:uid("e"),name:n,sets:3,reps:"40 sek",rest:20,unit:null}))}]}
  ]}
];
const MEASURES=["Lår","Mave","Talje","Bryst","Overarm","Hofte","Baller"];
const KINDLABEL={normal:"Normalt sæt",super:"Supersæt",drop:"Dropsæt",circuit:"Cirkeltræning på tid"};

/* ================= Lagring ================= */
const KEY="min-traening-v1";
function blank(){return{programs:DEFAULT_PROGRAMS(),sessions:[],weights:[],goal:null,measures:[],draft:null}}
let S;try{const raw=localStorage.getItem(KEY);S=raw?Object.assign(blank(),JSON.parse(raw)):blank()}catch(e){S=blank()}
let canStore=true;
function save(){try{const j=JSON.stringify(S);localStorage.setItem(KEY,j);if(localStorage.getItem(KEY)!==j)throw 0}catch(e){if(canStore){canStore=false;try{render()}catch(_){}}}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{localStorage.setItem(KEY+"-t","1");localStorage.removeItem(KEY+"-t")}catch(e){canStore=false}

/* ================= Hjælpere ================= */
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e}
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=(iso,o)=>new Date(iso+"T12:00:00").toLocaleDateString("da-DK",o||{day:"numeric",month:"short"});
const num=v=>{const x=parseFloat(String(v).replace(",","."));return isNaN(x)?null:x};
const fmtN=(x,d=1)=>x==null?"–":(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toLocaleString("da-DK");
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>x.classList.remove("on"),2200)}
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const videoURL=n=>"https://www.youtube.com/results?search_query="+encodeURIComponent(n.replace(/\s*\((højre|venstre)\)/,"")+" exercise form");
function findWO(pid,wid){const p=S.programs.find(x=>x.id===pid);return p?{p,w:p.workouts.find(x=>x.id===wid)}:{}}
function flat(w){const out=[];w.blocks.forEach((b,bi)=>b.ex.forEach((e,ei)=>out.push({e,b,bi,ei,letter:b.ex.length>1?String.fromCharCode(65+ei):null})));return out}
function countSets(w){return w.blocks.reduce((a,b)=>a+b.ex.reduce((s,e)=>s+(e.sets||1),0),0)}
function countEx(w){return w.blocks.reduce((a,b)=>a+b.ex.length,0)}
function lastSets(name){for(let i=S.sessions.length-1;i>=0;i--){const s=S.sessions[i];if(!s.log)continue;const r=s.log[name];if(r&&r.some(x=>x.done))return r}return null}

/* ================= Sheet ================= */
function openSheet(build){const bg=document.getElementById("sheetBg"),sh=document.getElementById("sheet"),inn=document.getElementById("sheetIn");inn.replaceChildren(build(closeSheet));bg.classList.add("on");sh.classList.add("on")}
function closeSheet(){document.getElementById("sheetBg").classList.remove("on");document.getElementById("sheet").classList.remove("on")}
document.getElementById("sheetBg").addEventListener("click",closeSheet);

/* ================= Navigation ================= */
let route={v:"train"};
